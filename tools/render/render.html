<!doctype html>
<meta charset="utf-8">
<style>
  /* The OP-XY's screen font, for every text on the screen: the artwork's
     slots and the stock header alike. Local rendering only. */
  @font-face { font-family: "XYScreen"; src: url("font/UniversNextPro-Light.ttf"); }
  html, body { margin: 0; background: #000; }
  #screen, #screen svg { display: block; width: 480px; height: 220px; }
  #screen text { font-family: "XYScreen" !important; font-weight: normal !important; font-style: normal !important; }
</style>
<div id="screen"></div>
<script type="module">
const Q31 = 0x7fffffff;
let t;   // the machine being rendered

// config: {id, sdk, values: [0..1 x8], model, sample, labels, shift}
window.setup = async config => {
  const { PreviewDisplay, SvgDisplay, headerSvg, NoteActivity } = await import(`./sdk/${config.sdk}/display.mjs`);
  const { controlPositions, editedShown, shownControls } = await import(`./sdk/${config.sdk}/controls.mjs`);
  const base = `m/${config.id}/`;
  const [manifest, bytes, art] = await Promise.all([
    fetch(base + 'manifest.json').then(r => r.json()),
    fetch(base + 'engine.wasm').then(r => r.arrayBuffer()),
    fetch(base + 'panel.svg').then(r => r.text()),
  ]);
  await document.fonts.load('20px XYScreen');
  const module = await WebAssembly.compile(bytes);
  const definition = manifest.definition;
  t = {
    config, definition, headerSvg, shownControls, controlPositions, editedShown,
    display: new PreviewDisplay(module),
    scene: new SvgDisplay(art, manifest.graphics),
    notes: NoteActivity ? new NoteActivity() : null,
    values: config.values.slice(),
    shown: [0, 1, 2, 3],
    model: config.model || 0,
    // An effect's shift row: whether Shift is held, and its four choices.
    shiftRow: config.shift ? { shift: false, choices: [0, 0, 0, 0] } : null,
    // A drum kit's Shift: held or not, and its choices (the kit, the machine, the choke group).
    drumShift: { shift: false, choices: [0, 0, 0, 0] },
  };
  if (config.sample) writeSample(t.display.api, config.sample);
  return { name: definition.name, params: definition.parameters.map(p => p.label), press: definition.press || null };
};

// The sample Grains' screen reads: a synthetic overview, as the device would hand it.
function writeSample(api, s) {
  if (!api.opxy_display_sample) return;
  const at = api.opxy_display_sample();
  const u32 = new Uint32Array(api.memory.buffer, at, 6);
  u32.set([1, 1, s.frames, s.rate, 0, s.frames]);
  new Uint8Array(api.memory.buffer, at + 24, 64).set(s.peaks);
}

const word = v => Math.round(Math.max(0, Math.min(1, v)) * Q31);

// One step of the timeline: events to apply, then a frame `elapsed` ms long.
window.step = (events, elapsed) => {
  for (const e of events) {
    if (e.on !== undefined) t.notes.noteOn(e.on);
    if (e.off !== undefined) t.notes.noteOff(e.off);
    if (e.model !== undefined) t.model = e.model;
    // A drum key: its machine and its eight stored controls, on the first row.
    if (e.key !== undefined) { t.model = e.key.model; t.values = e.key.values.slice(); t.shown = [0, 1, 2, 3]; }
    if (e.shift !== undefined) (t.shiftRow || t.drumShift).shift = e.shift;
    if (e.choice !== undefined) (t.shiftRow || t.drumShift).choices[e.choice[0]] = e.choice[1];
    if (e.set !== undefined) {
      t.values[e.set] = e.value;
      const press = t.definition.press === 'page';
      t.shown = t.editedShown(t.shown, t.controlPositions(t.definition.parameters), e.set, press);
    }
  }
  const words = t.values.map(word);
  while (words.length < 8) words.push(0);
  const frame = t.display.tick(t.shownControls(words, t.shown), Math.round(elapsed * 1.024),
                               t.notes.note_on_serial >>> 0, 0, false, t.notes,
                               t.config.sdk === 'aux' ? t.shiftRow : t.model,
                               ...(t.config.sdk === 'drum' ? [Number(t.drumShift.shift), t.drumShift.choices] : []));
  t.scene.apply(frame);
  const p = t.definition.parameters;
  const kitLabels = t.config.labels && t.config.labels[t.model];
  const titles = t.shown.map(i => kitLabels ? (kitLabels[i] || '').toLowerCase()
                                           : (p[i] && !p[i].absent ? p[i].label.toLowerCase() : ''));
  // Without the display's own value, a percent shows 0-100, as on the device, and anything else 0-127.
  const plain = i => String(Math.round(t.values[i] * (p[i].display === 'percent' ? 100 : 127)));
  let values = t.shown.map((i, k) => t.scene.header[k] || (p[i] && !p[i].absent ? plain(i) : ''));
  if (t.shiftRow && t.shiftRow.shift) {
    titles.splice(0, 4, ...t.config.shift.map(r => r.label.toLowerCase()));
    values = t.config.shift.map((r, k) => r.choices[t.shiftRow.choices[k]] || '');
  }
  document.getElementById('screen').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">
    <rect width="480" height="220" fill="#000"/>${t.headerSvg(titles, values)}${t.scene.svg()}</svg>`;
  return true;
};
window.ready = true;
</script>
